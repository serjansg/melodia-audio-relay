<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melodía — Escuchar en vivo</title>
<style>
  body {
    background: #1a120b;
    color: #e8d9c5;
    font-family: -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
  }
  h1 { color: #b87333; font-weight: 600; margin-bottom: 0.2em; }
  p { color: #a89684; }
  button {
    background: #b87333;
    color: #1a120b;
    border: none;
    padding: 16px 40px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 30px;
    cursor: pointer;
    margin-top: 20px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.alerta {
    background: #d68a3a;
    animation: pulso 1.2s infinite;
  }
  @keyframes pulso {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  #status { margin-top: 20px; font-size: 14px; color: #6b5d4f; }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #6b5d4f;
    margin-right: 6px;
  }
  .dot.live { background: #4caf50; }
  #volumenBox { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
  #volumenBox input[type="range"] {
    width: 160px;
    accent-color: #b87333;
  }
  #volumenLabel { font-size: 13px; color: #a89684; min-width: 34px; text-align: right; }
</style>
</head>
<body>
  <h1>Melodía</h1>
  <p>Transmisión en vivo</p>
  <button id="btnPlay">▶ Escuchar</button>
  <div id="status"><span class="dot" id="dot"></span><span id="statusText">Desconectado</span></div>

  <div id="volumenBox">
    <span>🔉</span>
    <input type="range" id="volumen" min="0" max="100" value="100">
    <span id="volumenLabel">100%</span>
  </div>

  <audio id="player" preload="none"></audio>

  <script>
    const btn = document.getElementById("btnPlay");
    const dot = document.getElementById("dot");
    const statusText = document.getElementById("statusText");
    const player = document.getElementById("player");
    const sliderVolumen = document.getElementById("volumen");
    const volumenLabel = document.getElementById("volumenLabel");

    // Volumen personal: solo afecta lo que escucha ESTA persona en su
    // propio navegador. No tiene ningún efecto sobre el host ni sobre
    // los demás oyentes conectados.
    const volumenGuardado = localStorage.getItem("melodia_volumen");
    if (volumenGuardado !== null) {
      sliderVolumen.value = volumenGuardado;
      volumenLabel.textContent = `${volumenGuardado}%`;
    }
    player.volume = sliderVolumen.value / 100;

    sliderVolumen.addEventListener("input", () => {
      const valor = sliderVolumen.value;
      player.volume = valor / 100;
      volumenLabel.textContent = `${valor}%`;
      localStorage.setItem("melodia_volumen", valor);
    });

    let escuchando = false;   // el usuario le dio play, queremos estar conectados
    let vivo = false;         // ya empezó a sonar al menos una vez
    let reintentoPendiente = null;

    // --- "Vigilante": revisa que el audio realmente esté avanzando ---
    // No confiamos solo en los eventos del navegador (a veces no avisan
    // cuando se corta una transmisión en vivo) -- revisamos directamente
    // si el tiempo de reproducción sigue avanzando.
    let ultimoTiempo = -1;
    let chequeosSinAvance = 0;

    setInterval(() => {
      if (!escuchando || !vivo || reintentoPendiente) return;

      if (player.currentTime === ultimoTiempo) {
        chequeosSinAvance++;
        if (chequeosSinAvance >= 2) {
          // ~6-8 segundos sin avanzar: se cortó, aunque el navegador
          // no haya avisado con un evento de error.
          vivo = false;
          chequeosSinAvance = 0;
          programarReintentoSilencioso();
        }
      } else {
        ultimoTiempo = player.currentTime;
        chequeosSinAvance = 0;
      }
    }, 3000);

    function urlStream() {
      return `/stream?t=${Date.now()}`;
    }

    function conectar(silencioso) {
      dot.classList.remove("live");
      statusText.textContent = "Conectando...";
      ultimoTiempo = -1;
      chequeosSinAvance = 0;
      player.src = urlStream();

      const promesa = player.play();
      if (promesa && promesa.catch) {
        promesa.catch(() => {
          if (silencioso) mostrarBotonReconectar();
        });
      }
    }

    function mostrarBotonReconectar() {
      if (reintentoPendiente) clearTimeout(reintentoPendiente);
      reintentoPendiente = null;
      btn.disabled = false;
      btn.textContent = "🔄 Toca para reconectar";
      btn.classList.add("alerta");
      statusText.textContent = "Se cortó la conexión";
    }

    function programarReintentoSilencioso() {
      if (!escuchando || reintentoPendiente) return;
      statusText.textContent = "Reconectando...";
      reintentoPendiente = setTimeout(() => {
        reintentoPendiente = null;
        if (escuchando) conectar(true);
      }, 2000);
    }

    btn.addEventListener("click", () => {
      escuchando = true;
      btn.disabled = true;
      btn.classList.remove("alerta");
      btn.textContent = "🎧 Escuchando";
      conectar(false);
    });

    player.addEventListener("playing", () => {
      vivo = true;
      dot.classList.add("live");
      statusText.textContent = "En vivo 🎵";
      btn.disabled = true;
      btn.classList.remove("alerta");
      btn.textContent = "🎧 Escuchando";
    });

    player.addEventListener("waiting", () => {
      statusText.textContent = "Cargando...";
    });

    player.addEventListener("stalled", programarReintentoSilencioso);
    player.addEventListener("error", programarReintentoSilencioso);
    player.addEventListener("ended", programarReintentoSilencioso);
  </script>
</body>
</html>
