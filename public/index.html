<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melodía — Escuchar en vivo</title>
<style>
  body {
    background: #1a120b;
    color: #e8d9c5;
    font-family: -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
  }
  h1 { color: #b87333; font-weight: 600; margin-bottom: 0.2em; }
  p { color: #a89684; }
  button {
    background: #b87333;
    color: #1a120b;
    border: none;
    padding: 16px 40px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 30px;
    cursor: pointer;
    margin-top: 20px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 20px; font-size: 14px; color: #6b5d4f; }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #6b5d4f;
    margin-right: 6px;
  }
  .dot.live { background: #4caf50; }
</style>
</head>
<body>
  <h1>Melodía</h1>
  <p>Transmisión en vivo</p>
  <button id="btnPlay">▶ Escuchar</button>
  <div id="status"><span class="dot" id="dot"></span><span id="statusText">Desconectado</span></div>

  <audio id="player" preload="none"></audio>

  <script>
    const btn = document.getElementById("btnPlay");
    const dot = document.getElementById("dot");
    const statusText = document.getElementById("statusText");
    const player = document.getElementById("player");

    // Cache-buster: cada clic pide una conexión nueva, para evitar que
    // el navegador reutilice una conexión vieja o cacheada.
    function urlStream() {
      return `/stream?t=${Date.now()}`;
    }

    btn.addEventListener("click", () => {
      btn.disabled = true;
      btn.textContent = "Conectando...";
      statusText.textContent = "Conectando...";

      player.src = urlStream();
      player.play().catch((e) => {
        console.error("Error al reproducir:", e);
        statusText.textContent = "Error, intenta de nuevo";
        btn.disabled = false;
        btn.textContent = "▶ Escuchar";
      });
    });

    player.addEventListener("playing", () => {
      dot.classList.add("live");
      statusText.textContent = "En vivo 🎵";
      btn.textContent = "🎧 Escuchando";
    });

    player.addEventListener("waiting", () => {
      statusText.textContent = "Cargando...";
    });

    player.addEventListener("stalled", () => {
      statusText.textContent = "Conexión inestable...";
    });

    player.addEventListener("error", () => {
      dot.classList.remove("live");
      statusText.textContent = "Se cortó la conexión";
      btn.disabled = false;
      btn.textContent = "▶ Reintentar";
    });
  </script>
</body>
</html>
