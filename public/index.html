<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melodía — Escuchar en vivo</title>
<style>
  body {
    background: #1a120b;
    color: #e8d9c5;
    font-family: -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
  }
  h1 { color: #b87333; font-weight: 600; margin-bottom: 0.2em; }
  p { color: #a89684; }
  button {
    background: #b87333;
    color: #1a120b;
    border: none;
    padding: 16px 40px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 30px;
    cursor: pointer;
    margin-top: 20px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 20px; font-size: 14px; color: #6b5d4f; }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #6b5d4f;
    margin-right: 6px;
  }
  .dot.live { background: #4caf50; }
</style>
</head>
<body>
  <h1>Melodía</h1>
  <p>Transmisión en vivo</p>
  <button id="btnPlay">▶ Escuchar</button>
  <div id="status"><span class="dot" id="dot"></span><span id="statusText">Desconectado</span></div>

  <audio id="player" preload="none"></audio>

  <script>
    const btn = document.getElementById("btnPlay");
    const dot = document.getElementById("dot");
    const statusText = document.getElementById("statusText");
    const player = document.getElementById("player");

    let escuchando = false;      // true = el usuario quiere estar conectado
    let reintentoPendiente = null;

    function urlStream() {
      return `/stream?t=${Date.now()}`;
    }

    function conectar() {
      dot.classList.remove("live");
      statusText.textContent = "Conectando...";
      player.src = urlStream();
      player.play().catch(() => {
        // El navegador a veces bloquea el autoplay en reconexiones
        // automáticas silenciosas; no es un error grave, reintentamos.
        programarReintento();
      });
    }

    function programarReintento() {
      if (!escuchando || reintentoPendiente) return;
      statusText.textContent = "Reconectando...";
      reintentoPendiente = setTimeout(() => {
        reintentoPendiente = null;
        if (escuchando) conectar();
      }, 2000);
    }

    btn.addEventListener("click", () => {
      escuchando = true;
      btn.disabled = true;
      btn.textContent = "🎧 Escuchando";
      conectar();
    });

    player.addEventListener("playing", () => {
      dot.classList.add("live");
      statusText.textContent = "En vivo 🎵";
    });

    player.addEventListener("waiting", () => {
      statusText.textContent = "Cargando...";
    });

    // Estos tres eventos pasan cuando el host se reconecta (cortamos su
    // conexión a propósito del lado del servidor) o cuando hay cualquier
    // corte de red -- en todos los casos, reconectamos solos.
    player.addEventListener("stalled", programarReintento);
    player.addEventListener("error", programarReintento);
    player.addEventListener("ended", programarReintento);
  </script>
</body>
</html>
